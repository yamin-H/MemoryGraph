version: "3.9"

# MemoryGraph stack — uses official HydraDB OSS (NOT Neo4j Community).
# Docs: docs/HYDRADB_SETUP.md | Upstream: https://github.com/hydra-db/hydradb

services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:0.1.1@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    container_name: memorygraph-hydradb
    restart: unless-stopped
    ports:
      - "7687:7687"   # Bolt (Neo4j-driver compatible)
      - "8443:8443"   # HTTPS query API
      - "9090:9090"   # Admin /readyz /metrics
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=0.0.0.0:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 0.0.0.0:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    volumes:
      # Bind mount so scripts/setup_hydradb.py can create store/, cache/, auth-token
      - ./hydradb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: memorygraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: memorygraph-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: memorygraph_baseline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: memorygraph-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HYDRADB_URI: neo4j://hydradb:7687
      HYDRADB_TOKEN: local-development-token-32-bytes
      HYDRADB_ADMIN_URL: http://hydradb:9090
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/memorygraph_baseline
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_demo_mock_key}
      GRAPH_NAMESPACE: default
      GRAPH_CELL_ID: cell-0
    volumes:
      - ./apps/api:/app/apps/api
      - ./data:/app/data
      - ./scripts:/app/scripts
    depends_on:
      hydradb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: memorygraph-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  redis_data:
  postgres_data:
